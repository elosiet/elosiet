<style>
:root{
  --bg:#0a0b09; --ink:#ece3cf; --mute:#9a927e; --dim:#6b6455;
  --gold:#c9a45c; --gold-hi:#e8cb8c; --sapphire:#7cc0cf; --amber:#e3a23f;
  --line:rgba(201,164,92,.32);
  --display:'Federo','Josefin Sans',Georgia,serif;
  --ui:'Josefin Sans','Segoe UI',system-ui,sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --ease:cubic-bezier(.22,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,#c:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
::selection{background:var(--gold);color:#111}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;opacity:0;transition:opacity 1.8s ease}
body.in #c{opacity:1}

/* ---------------- the door ---------------- */
#door{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 46%,#16130e 0%,#0a0b09 62%);transition:opacity 1.1s ease 0.5s}
#door.away{opacity:0;pointer-events:none}
#door.gone{display:none}
.door-wrap{display:flex;flex-direction:column;align-items:center;gap:26px;transition:transform 1.4s var(--ease),opacity 1s ease}
#door.away .door-wrap{transform:scale(1.18);opacity:0}
.door{position:relative;width:min(178px,38vw);aspect-ratio:200/290;color:var(--gold);perspective:900px}
.door svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.door .leaf{position:absolute;inset:0;transform-origin:15.5% 50%;transition:transform 1.6s cubic-bezier(.55,.05,.25,1);will-change:transform}
#door.open .door .leaf{transform:rotateY(78deg)}
.door .glow{opacity:0;transition:opacity .6s ease}
#door.knocked .door .glow{opacity:.45}
#door.open .door .glow{opacity:1}
.door .slot{transition:transform .35s var(--ease)}
#door.knocked .door .slot{transform:translateX(15px)}
.door-name{font-family:var(--display);font-size:22px;letter-spacing:.62em;padding-left:.62em;color:var(--ink)}
.door-sub{font-size:11px;letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;color:var(--mute);margin-top:-14px}
.door-line{width:150px;height:1px;background:rgba(201,164,92,.18);position:relative;overflow:hidden}
.door-line i{position:absolute;inset:0;width:0;background:var(--gold);transition:width .4s ease}
#knock{font-size:12px;letter-spacing:.38em;padding:13px 26px 11px calc(26px + .38em);text-transform:uppercase;color:var(--gold-hi);border:1px solid var(--line);
  opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .8s ease,transform .8s var(--ease),border-color .3s,background .3s}
#knock.ready{opacity:1;transform:none;pointer-events:auto}
#knock:hover{border-color:var(--gold);background:rgba(201,164,92,.08)}
#door small{font-size:11px;color:var(--dim);letter-spacing:.16em;margin-top:-10px;opacity:0;transition:opacity .8s ease .3s}
#knock.ready + small{opacity:1}
#fail{display:none;max-width:340px;text-align:center;color:var(--mute);font-size:14px;line-height:1.6}
#fail a{color:var(--gold)}

/* ---------------- HUD ---------------- */
.hud{position:fixed;z-index:10;opacity:0;transition:opacity 1.2s ease 1.2s;pointer-events:none;text-shadow:0 1px 14px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.8)}
body.in .hud{opacity:1}
body.in .hud > *{pointer-events:auto}
.cap{font-size:11px;letter-spacing:.26em;text-transform:uppercase}
#brand{top:max(22px,env(safe-area-inset-top));left:26px;display:flex;align-items:center;gap:14px}
#brand svg{width:30px;height:30px;color:var(--gold);flex:none}
#brand b{display:block;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.34em;color:var(--ink)}
#brand span{display:block;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);margin-top:3px}
#topnav{top:max(24px,env(safe-area-inset-top));right:24px;display:flex;align-items:center;gap:6px}
.navb{position:relative;padding:8px 12px 6px;color:var(--ink);transition:color .25s}
.navb::after{content:'';position:absolute;left:12px;right:calc(12px + .26em);bottom:2px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.navb:hover{color:var(--gold-hi)}
.navb:hover::after{transform:scaleX(1)}
.ico{width:34px;height:34px;display:grid;place-items:center;color:var(--ink);transition:color .25s}
.ico:hover{color:var(--gold-hi)}
.ico svg{width:17px;height:17px;fill:currentColor}
#radio{left:26px;bottom:max(22px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
.onair{display:flex;align-items:center;gap:8px;color:var(--mute)}
.onair i{width:6px;height:6px;border-radius:50%;background:var(--dim);transition:background .3s,box-shadow .3s}
.playing .onair i{background:var(--amber);box-shadow:0 0 10px var(--amber)}
#station{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink);letter-spacing:.02em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#station em{font-family:var(--ui);font-style:normal;font-size:10.5px;letter-spacing:.2em;color:var(--gold);margin-right:8px}
.rbtns{display:flex;align-items:center}
.rbtns button{width:30px;height:30px;display:grid;place-items:center;color:var(--ink);transition:color .2s}
.rbtns button:hover{color:var(--gold-hi)}
.rbtns svg{width:13px;height:13px;fill:currentColor}
.rbtns #rplay svg{width:15px;height:15px}
#links{right:22px;bottom:max(20px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:2px}
#links a,#links button{width:34px;height:34px;display:grid;place-items:center;color:var(--mute);transition:color .25s,transform .35s var(--ease)}
#links a:hover,#links button:hover{color:var(--gold-hi);transform:translateY(-2px)}
#links svg{width:16px;height:16px;fill:currentColor}
#links .sep{width:1px;height:14px;background:var(--line);margin:0 8px}
#hint{left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom) + 58px));transform:translateX(-50%);color:var(--mute);white-space:nowrap;transition:opacity .8s ease}
#hint.off{opacity:0 !important}

#tip{position:fixed;z-index:20;pointer-events:none;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);white-space:nowrap;
  transform:translate(-50%,-100%) translateY(4px);opacity:0;transition:opacity .25s ease,transform .4s var(--ease);text-shadow:0 1px 8px #000}
#tip.on{opacity:1;transform:translate(-50%,-100%) translateY(-6px)}
#tip i{display:block;font-family:var(--serif);font-style:italic;font-size:14px;letter-spacing:.02em;text-transform:none;color:var(--gold-hi);margin-top:2px;text-align:center}
#toast{position:fixed;z-index:40;left:50%;top:max(28px,env(safe-area-inset-top));transform:translate(-50%,-10px);opacity:0;pointer-events:none;
  font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink);transition:opacity .4s ease,transform .5s var(--ease);text-shadow:0 1px 10px #000}
#toast.on{opacity:1;transform:translate(-50%,0)}
#bubble{position:fixed;z-index:21;left:0;top:0;pointer-events:none;max-width:230px;padding:9px 14px 10px;background:#ece2cb;color:#2a2216;font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.25;
  border-radius:12px;box-shadow:0 12px 30px -8px rgba(0,0,0,.75);transform-origin:18px 100%;opacity:0;transition:opacity .2s ease,scale .4s cubic-bezier(.3,1.6,.5,1);scale:.8;translate:-18px calc(-100% - 16px)}
#bubble.on{opacity:1;scale:1}
#bubble::after{content:'';position:absolute;left:13px;bottom:-6px;width:13px;height:13px;background:#ece2cb;transform:rotate(45deg);border-radius:2px}

/* ---------------- the menu (paper) ---------------- */
#menu{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(6,6,5,.55);opacity:0;pointer-events:none;transition:opacity .5s ease}
#menu.on{opacity:1;pointer-events:auto}
.paper{position:relative;width:min(940px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;color:#211c14;
  background:#ece2cb radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.5),transparent 60%);box-shadow:0 30px 80px -20px rgba(0,0,0,.8);
  transform:translateY(24px) rotate(-.4deg);transition:transform .7s var(--ease)}
#menu.on .paper{transform:none}
/* the printed frame sits on the paper, not in the scrolling text, so it never slides through the words */
.pframe{position:absolute;inset:12px;border:1px solid #9c8150;pointer-events:none;z-index:2}
.pframe::after{content:'';position:absolute;inset:4px;border:1px solid rgba(156,129,80,.45)}
.pscroll{overflow:auto;overscroll-behavior:contain;padding:46px 58px 40px;scrollbar-width:none}
.pscroll::-webkit-scrollbar{display:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 52px}
.paper .close{position:absolute;top:22px;right:24px;width:34px;height:34px;font-size:22px;color:#6f5a35;z-index:3}
.paper .close:hover{color:#211c14}
.m-head{text-align:center;margin-bottom:26px}
.m-head svg{width:44px;height:44px;color:#8b6b33}
.m-head h2{font-family:var(--display);font-weight:400;font-size:40px;letter-spacing:.42em;padding-left:.42em;margin:8px 0 2px}
.m-head p{font-family:var(--serif);font-style:italic;font-size:17px;color:#5b4d36}
.m-head small{display:block;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:#8a7a5c;margin-top:6px}
.paper h3{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#7a6034;text-align:center;margin:6px 0 16px;display:flex;align-items:center;gap:14px}
.paper h3::before,.paper h3::after{content:'';flex:1;height:1px;background:#b9a273}
.item{margin-bottom:16px}
.item .row{display:flex;align-items:baseline;gap:8px}
.item b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.06em}
.item .dots{flex:1 1 24px;min-width:24px;border-bottom:1px dotted #9c8150;transform:translateY(-4px)}
.item .pr{font-family:var(--serif);font-style:italic;font-size:16px;color:#6b5530;white-space:nowrap}
.item .role{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8b6b33;margin:3px 0 2px}
.item p{font-family:var(--serif);font-size:17px;line-height:1.45;color:#3d3426}
.item .tg{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8a7a5c;margin-top:3px}
.m-foot{text-align:center;font-family:var(--serif);font-style:italic;font-size:16px;color:#5b4d36;margin-top:24px}

@media (max-width:760px){
  #brand{left:18px}
  #brand b{font-size:15px}
  #topnav{right:10px}
  .navb{padding:8px 8px 6px}
  #radio{left:16px;bottom:max(62px,calc(env(safe-area-inset-bottom) + 54px));gap:10px}
  #station{max-width:170px;font-size:15px}
  #links{left:0;right:0;justify-content:center;bottom:max(14px,env(safe-area-inset-bottom))}
  #hint{display:none}
  .pscroll{padding:40px 30px 36px}
  .cols{grid-template-columns:1fr}
  .cols section + section h3{margin-top:24px}
  .m-head h2{font-size:32px}
}
@media (max-width:420px){ #brand span{display:none} .navb.hide-s{display:none} }
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>

  box(.008, .008, .04, M.brass, 0, .278, .02, g);
  const sh = new THREE.Group(); sh.position.set(0, .286, .042); g.add(sh);
  const sgeo = new THREE.CylinderGeometry(.052, .052, .23, 48, 1, true, 0, Math.PI); sgeo.rotateZ(Math.PI / 2);
  const outer = new THREE.Mesh(sgeo, new THREE.MeshPhysicalMaterial({ color: 0x0b5a3a, roughness: .14, clearcoat: 1, clearcoatRoughness: .05, emissive: 0x0d4a2f, emissiveIntensity: .35 }));
  outer.castShadow = true; sh.add(outer);

  const inner = new THREE.Mesh(sgeo, innerMat); inner.scale.set(1, .97, .97); sh.add(inner);
  [-.115, .115].forEach((x) => { const cap = new THREE.Mesh(new THREE.CircleGeometry(.053, 32, 0, Math.PI), M.brass); cap.rotation.y = x > 0 ? Math.PI / 2 : -Math.PI / 2; cap.rotation.z = 0; cap.position.x = x; cap.geometry.rotateZ(0); sh.add(cap); });
  const rim = new THREE.Mesh(new THREE.TorusGeometry(.052, .0018, 8, 48, Math.PI), M.brass); rim.rotation.y = Math.PI / 2; rim.position.x = .115; sh.add(rim);
  const rim2 = rim.clone(); rim2.position.x = -.115; sh.add(rim2);

/* =====================================================================
   CAMERA · CARD · INTERACTION
   ===================================================================== */
const S = { hover: null, row: null, px: 0, py: 0, tpx: 0, tpy: 0, started: false, intro: 0, down: null, tapOk: false, menu: false, picked: false, ap: .011, aim: null, aimOn: false };
let HOME, INTRO, view, ray, ndc, tmp, tmp2, UP, qA, qB, eA;

function homePose(aspect) {
  const k = clamp((aspect - .55) / 1.2, 0, 1), W0 = lerp(.28, .4, k), fov = 34, t2 = 2 * Math.tan(fov * Math.PI / 360);
  // phones: a slightly wider shot nudged left so Volt stays in frame next to the card
  const d = Math.max(W0 / aspect, .19) / t2 + .075, el = 9 * Math.PI / 180, look = V3(lerp(-.04, 0, k), .052, -.075);
  HOME = { look, pos: look.clone().add(V3(0, Math.sin(el) * d, Math.cos(el) * d)), fov };
  INTRO = { look: look.clone().add(V3(0, .04, 0)), pos: look.clone().add(V3(Math.sin(-.35) * d * 1.9, Math.sin(.32) * d * 1.9, Math.cos(-.35) * d * 1.9)), fov: fov + 6 };
}
function updateCamera(dt, t) {
  S.px = damp(S.px, S.tpx, 2.6, dt); S.py = damp(S.py, S.tpy, 2.6, dt);
  if (!S.started) { view.pos.copy(INTRO.pos); view.look.copy(INTRO.look); view.fov = INTRO.fov; }
  else if (S.intro < 1) {
    // one eased move in through the door: swing the offset round the bar instead of sliding in a straight line
    S.intro = Math.min(1, S.intro + dt / 3.6); const e = ease3(S.intro);
    tmp.copy(INTRO.pos).sub(INTRO.look); tmp2.copy(HOME.pos).sub(HOME.look);
    const l0 = tmp.length(), l1 = tmp2.length(); tmp.normalize(); tmp2.normalize();
    qA.setFromUnitVectors(tmp, tmp2); qB.identity().slerp(qA, e); tmp.applyQuaternion(qB).multiplyScalar(lerp(l0, l1, e));
    view.look.lerpVectors(INTRO.look, HOME.look, e); view.pos.copy(view.look).add(tmp); view.fov = lerp(INTRO.fov, HOME.fov, e);
  } else { const a = 1 - Math.exp(-3 * dt); view.pos.lerp(HOME.pos, a); view.look.lerp(HOME.look, a); view.fov = lerp(view.fov, HOME.fov, a); }
  const pf = (W.card.held ? .3 : 1) * ease3(S.intro);
  tmp.copy(view.pos).sub(view.look);
  tmp.applyAxisAngle(UP, (-S.px * .11 + Math.sin(t * .13) * .012) * pf);
  tmp2.crossVectors(UP, tmp).normalize(); tmp.applyAxisAngle(tmp2, (S.py * .06 + Math.sin(t * .17) * .006) * pf);
  camera.position.copy(view.look).add(tmp); camera.lookAt(view.look);
  if (Math.abs(camera.fov - view.fov) > .01) { camera.fov = view.fov; camera.updateProjectionMatrix(); }
}
/* the card travels on a timed, eased path: up out of the stand, then into your hand — and back the same way */
function updateCard(dt, t) {
  const C = W.card, v = C.v;
  C.t = clamp(C.t + (C.held ? dt : -dt) / .85, 0, 1);
  C.f = clamp(C.f + (C.flipped ? dt : -dt) / .55, 0, 1);
  const e = ease3(C.t), fa = ease3(C.f) * Math.PI;
  C.hover = damp(C.hover, S.hover && S.hover.type === 'card' && !C.held ? 1 : 0, 8, dt);
  v.p0.copy(STAND_POS); v.p0.y += C.hover * .0022; v.q0.setFromEuler(STAND_ROT);
  if (e > 0) {
    const fov = camera.fov * Math.PI / 180, a = camera.aspect, fill = a > 1 ? .47 : .86, visW = .089 / fill, d = visW / a / (2 * Math.tan(fov / 2));
    camera.getWorldDirection(v.fwd); v.up.set(0, 1, 0).applyQuaternion(camera.quaternion);
    v.p1.copy(camera.position).addScaledVector(v.fwd, d + Math.sin(fa) * .022).addScaledVector(v.up, -visW * .03 + Math.sin(t * 1.1) * .0006);
    C.tx = damp(C.tx, -S.py * .2, 5, dt); C.ty = damp(C.ty, S.px * .3, 5, dt);
    eA.set(C.tx + Math.sin(t * .9) * .012, C.ty + Math.sin(t * .7) * .016, 0);

    bokehPass.uniforms.focus.value = camera.position.distanceTo(W.card.g.position); bokehPass.uniforms.aperture.value = S.ap * ab; bokehPass.uniforms.maxblur.value = .01 * ab;
    gradePass.uniforms.uTime.value = t; gradePass.uniforms.uDim.value = damp(gradePass.uniforms.uDim.value, W.card.held ? 1 : 0, 4, dt);
  };
  requestAnimationFrame(frame);

  // the door
  knock.classList.add('ready'); knock.focus({ preventScroll: true });
  knock.addEventListener('click', () => {
    if (S.started) return; knock.disabled = true;
    radio.init(); radio.resume(); radio.knock();
    const door = $('#door'); door.classList.add('knocked');
    setTimeout(() => { door.classList.add('open'); radio.creak(); }, 700);
    setTimeout(() => { document.body.classList.add('in'); S.started = true; door.classList.add('away'); radio.play(0); }, 1250);
    setTimeout(() => door.classList.add('gone'), 3300);
    setTimeout(() => { W.robot.wave = 1.9; W.robot.smile = 2; say('Evening! Welcome to the bar.'); }, 4300);
    setTimeout(() => { if (!W.card.held && !S.menu) setHint('Pick up the card'); }, 5200);
    setTimeout(() => { if (!S.picked && !S.menu) { W.robot.wave = 1.9; say('Psst — that card’s for you.'); } }, 24000);
  }, { once: true });
  if (location.hash === '#debug') window.__bar = { settle: () => { S.intro = 1; view.pos.copy(HOME.pos); view.look.copy(HOME.look); view.fov = HOME.fov; }, say, pokeRobot,
    run: (sec) => { let t = clock.elapsedTime; for (let i = 0; i < sec * 30; i++) { t += 1 / 30; advance(1 / 30, t); } composer.render(); }, THREE, scene, camera, renderer, composer, bokehPass, bloomPass, gradePass, W, S, radio, activate, pickUp, putBack, openMenu, closeMenu };
}
main().catch((e) => { console.error(e); const f = $('#fail'); if (f) { f.style.display = 'block'; f.textContent = 'Error: ' + (e && e.message || e); } });
